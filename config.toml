# DNSLog 平台配置文件
# 命令行参数优先级高于配置文件，配置文件优先级高于环境变量

# 域名后缀（生成的子域名格式：随机字符.{domain}）
domain = "example.com"

# DNS 服务端口（环境变量: DNS_PORT）
dns_port = 53

# Web HTTP 端口（环境变量: WEB_PORT）
web_port = 8888

# HTTPS 端口（环境变量: HTTPS_PORT）
# 启用后 HTTP 请求将自动跳转到 HTTPS
# https_port = 443

# TLS 证书配置
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"
